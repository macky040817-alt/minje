<!DOCTYPE html>
<html>

<!-- 웹페이지의 설정(제목) _ head -->
<head> 
    <title> 조민제의 웹페이지 </title>
</head>

<!-- 웹페이지에 표시되는 내용 _ body -->
 <!-- h1 : 큰 제목 / p : 문단 -->
<body>
    <h1>안녕하세요!</h1>
    <p>프론트엔드</p>

    <!-- alert : 작은 알림창 띄우기 -->
    <button onclick = "alert('안녕하세요!')"> 클릭
    </button>

</body>

</html>
